<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>차집사 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700;800&family=Playfair+Display:wght@600;700&display=swap">
<style>
  :root {
    --p50:#F3EEFA; --p100:#E0D2F0; --p200:#C4A9E3; --p300:#A67FD3; --p400:#8A5BC0;
    --p500:#6B3FA0; --p600:#5A3489; --p700:#472968; --p800:#331E4A; --p900:#20132E;
    --primary:var(--p500);
    --ink:#1A1A3A; --ink-deep:#14101F; --steel:#5B5B72; --neutral:#9797A8;
    --line:#E7E3EF; --line-soft:#F0EDF5;
    --off:#FAFAF8; --white:#FFFFFF;
    --lime:#C4FF4D; --lime-ink:#3B4D07;
    --success:#2ECC8A; --success-50:#E6F9F1; --success-800:#0F6B45;
    --warning:#F5A623; --warning-50:#FEF3E0; --warning-800:#8A5A0A;
    --danger:#E24B4A; --danger-50:#FCE9E9; --danger-800:#8E2323;
    --sans: Pretendard, "Gothic A1", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, -apple-system, sans-serif;
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
    --r-btn:8px; --r-card:12px; --r-lg:16px; --r-pill:999px;
    --page-bg:#EDE8F4; --page-ink:#1A1A3A;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--page-bg); color:var(--page-ink);
    font-family:var(--sans); font-size:14px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  button { font-family:inherit; font-size:inherit; cursor:pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--p400); outline-offset:2px; }
  .shell { min-height:100%; display:flex; flex-direction:column; }

  /* ---------- Top bar (prototype chrome) ---------- */
  .topbar {
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding-block:14px; padding-inline:24px;
    background:var(--white); border-bottom:1px solid var(--line);
  }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand .mark { width:32px; height:32px; border-radius:8px; }
  .brand strong { font-size:16px; font-weight:800; color:var(--ink); letter-spacing:-0.01em; }
  .brand span { font-size:12px; color:var(--neutral); margin-left:6px; }
  .seg { display:inline-flex; background:var(--p50); border-radius:var(--r-pill); padding:3px; margin-left:auto; }
  .seg button {
    border:0; background:transparent; color:var(--steel); padding:7px 16px; border-radius:var(--r-pill); font-weight:700;
  }
  .seg button[aria-pressed="true"] { background:var(--ink-deep); color:var(--white); }
  .meta { font-size:12px; color:var(--neutral); }
  .meta b { color:var(--steel); font-weight:700; }

  /* ---------- Stage ---------- */
  .stage {
    flex:1; display:grid; grid-template-columns:280px minmax(0,1fr); gap:32px;
    padding-block:32px; padding-inline:24px; max-width:1100px; width:100%; margin:0 auto;
  }
  .flow { display:flex; flex-direction:column; gap:12px; }
  .flow h2 { margin:0; font-size:12px; font-weight:700; color:var(--neutral); letter-spacing:0.06em; text-transform:uppercase; }
  .flow ol { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
  .flow li button {
    width:100%; text-align:left; border:0; background:transparent; padding:8px 10px; border-radius:var(--r-btn);
    display:flex; gap:10px; align-items:baseline; color:var(--steel);
  }
  .flow li button:hover { background:var(--white); }
  .flow li button[aria-current="true"] { background:var(--white); color:var(--ink); font-weight:700; box-shadow:0 1px 0 var(--line); }
  .flow li button .n { font-family:var(--serif); font-size:13px; color:var(--p400); min-width:18px; }
  .flow .note { font-size:12px; color:var(--neutral); border-top:1px solid var(--line); padding-top:12px; line-height:1.6; }
  .flow .note b { color:var(--steel); }

  .device-wrap { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .device {
    width:390px; max-width:100%; height:780px; background:var(--off); border-radius:44px;
    border:8px solid var(--ink-deep); box-shadow:0 30px 60px -30px rgba(32,19,46,0.5);
    position:relative; overflow:hidden; display:flex; flex-direction:column;
  }
  .statusbar {
    height:44px; display:flex; align-items:center; justify-content:space-between; padding-inline:26px 22px;
    font-size:13px; font-weight:700; color:var(--ink); flex:0 0 auto;
  }
  .statusbar .notch { position:absolute; left:50%; top:10px; transform:translateX(-50%); width:110px; height:28px; background:var(--ink-deep); border-radius:var(--r-pill); }
  .screen { flex:1; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; }
  .screen::-webkit-scrollbar { width:0; }
  .tabbar {
    flex:0 0 auto; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; border-top:1px solid var(--line);
    background:var(--white); padding-block:8px 18px;
  }
  .tabbar button { border:0; background:transparent; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--neutral); font-size:11px; font-weight:700; }
  .tabbar button svg { width:22px; height:22px; }
  .tabbar button[aria-current="true"] { color:var(--primary); }
  .tabbar[hidden] { display:none; }
  .hint { font-size:12px; color:var(--neutral); text-align:center; }

  /* ---------- In-app primitives ---------- */
  .page { padding-inline:20px; padding-block:8px 24px; display:flex; flex-direction:column; gap:16px; flex:1; }
  .apphead { display:flex; align-items:center; gap:10px; min-height:40px; }
  .apphead .back { border:0; background:transparent; width:36px; height:36px; margin-left:-8px; border-radius:var(--r-btn); display:grid; place-items:center; color:var(--ink); }
  .apphead h1 { margin:0; font-size:20px; font-weight:700; color:var(--ink); text-wrap:balance; }
  .apphead .right { margin-left:auto; font-size:12px; color:var(--neutral); }
  .eyebrow { font-size:12px; font-weight:700; color:var(--neutral); letter-spacing:0.04em; }
  .h2 { margin:0; font-size:16px; font-weight:700; color:var(--ink); }
  .display { font-size:24px; font-weight:800; color:var(--ink); line-height:1.3; margin:0; letter-spacing:-0.01em; text-wrap:balance; }
  .muted { color:var(--steel); }
  .small { font-size:12px; color:var(--neutral); }
  .num { font-family:var(--serif); font-weight:700; font-variant-numeric:tabular-nums; }

  .card { background:var(--white); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px; display:flex; flex-direction:column; gap:12px; }
  .card.tight { padding:16px; border-radius:var(--r-card); }
  .card.reco { border:2px solid var(--primary); }
  .card.dark { background:var(--ink-deep); border-color:var(--ink-deep); color:var(--white); }
  .card.dark .small, .card.dark .muted { color:rgba(255,255,255,0.65); }
  .card.soft { background:var(--p50); border-color:var(--p50); }
  .row { display:flex; align-items:center; gap:12px; }
  .row.between { justify-content:space-between; }
  .stack { display:flex; flex-direction:column; gap:8px; }
  .kv { display:grid; grid-template-columns:96px 1fr; gap:6px 12px; font-size:13px; }
  .kv dt { color:var(--neutral); margin:0; }
  .kv dd { margin:0; color:var(--ink); }

  .btn { border:0; border-radius:var(--r-btn); padding:14px 28px; font-weight:700; font-size:15px; display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; }
  .btn.primary { background:var(--ink-deep); color:var(--white); }
  .btn.primary .arrow { color:var(--lime); }
  .btn.purple { background:var(--primary); color:var(--white); }
  .btn.ghost { background:transparent; border:1.5px solid var(--primary); color:var(--primary); }
  .btn.soft { background:var(--p100); color:var(--p700); }
  .btn.line { background:var(--white); border:1px solid var(--line); color:var(--ink); }
  .btn.danger { background:var(--danger-50); color:var(--danger-800); }
  .btn.sm { padding:9px 14px; font-size:13px; width:auto; }
  .btn:disabled { opacity:0.45; cursor:not-allowed; }
  .btnrow { display:flex; gap:8px; }
  .btnrow .btn { flex:1; }

  .pill { display:inline-flex; align-items:center; gap:6px; border-radius:var(--r-pill); padding:5px 12px; font-size:12px; font-weight:700; line-height:1.2; white-space:nowrap; }
  .pill.purple { background:var(--p50); color:var(--p800); }
  .pill.success { background:var(--success-50); color:var(--success-800); }
  .pill.warning { background:var(--warning-50); color:var(--warning-800); }
  .pill.danger { background:var(--danger-50); color:var(--danger-800); }
  .pill.neutral { background:var(--line-soft); color:var(--steel); }
  .pill.lime { background:var(--ink-deep); color:var(--white); }
  .dot { width:8px; height:8px; border-radius:50%; background:currentColor; flex:0 0 auto; }
  .dot.lime { background:var(--lime); }

  .field { display:flex; flex-direction:column; gap:6px; }
  .field label { font-size:12px; font-weight:700; color:var(--steel); }
  .input { width:100%; border:1px solid var(--line); border-radius:var(--r-btn); padding:12px 14px; font-size:15px; background:var(--white); color:var(--ink); font-family:inherit; }
  .input:focus { border-color:var(--p400); outline:none; }
  .choice { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .choice button { border:1px solid var(--line); background:var(--white); border-radius:var(--r-btn); padding:12px; font-weight:700; color:var(--steel); }
  .choice button[aria-pressed="true"] { border-color:var(--primary); color:var(--p700); background:var(--p50); }

  .list { display:flex; flex-direction:column; }
  .list .item { display:flex; align-items:center; gap:12px; padding-block:12px; border-top:1px solid var(--line-soft); text-align:left; background:transparent; border-left:0; border-right:0; border-bottom:0; width:100%; color:inherit; }
  .list .item:first-child { border-top:0; }
  .list .item .grow { flex:1; min-width:0; }
  .list .item .t { font-weight:700; color:var(--ink); }
  .list .item .s { font-size:12px; color:var(--neutral); }
  .list .item .chev { color:var(--neutral); }

  .photo { aspect-ratio:4/3; border-radius:var(--r-card); position:relative; overflow:hidden; display:grid; place-items:center; color:var(--white); font-weight:700; font-size:13px; border:0; width:100%; }
  .photo.before { background:linear-gradient(135deg,#7D7A8C 0%,#B3B0BE 100%); }
  .photo.after { background:linear-gradient(135deg,#8A5BC0 0%,#C4A9E3 100%); }
  .photo .tag { position:absolute; top:10px; left:10px; background:rgba(20,16,31,0.7); padding:4px 10px; border-radius:var(--r-pill); font-size:11px; }
  .photo .shot { position:absolute; bottom:10px; right:10px; background:var(--lime); color:var(--lime-ink); padding:4px 10px; border-radius:var(--r-pill); font-size:11px; }
  .photos { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; font-size:12px; }
  .cal .d { padding:6px 0; border-radius:8px; color:var(--steel); position:relative; }
  .cal .d.dim { color:var(--line); }
  .cal .d.today { background:var(--ink-deep); color:var(--white); font-weight:700; }
  .cal .d.wash::after, .cal .d.oil::after { content:""; position:absolute; left:50%; bottom:2px; transform:translateX(-50%); width:5px; height:5px; border-radius:50%; }
  .cal .d.wash::after { background:var(--primary); }
  .cal .d.oil::after { background:var(--warning); }
  .cal .d.today.wash::after { background:var(--lime); }
  .legend { display:flex; gap:14px; font-size:11px; color:var(--neutral); }
  .legend i { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:5px; vertical-align:middle; }

  .plans { display:flex; flex-direction:column; gap:10px; }
  .plan { border:1px solid var(--line); background:var(--white); border-radius:var(--r-lg); padding:16px; display:flex; align-items:center; gap:12px; text-align:left; width:100%; color:inherit; }
  .plan[aria-pressed="true"] { border:2px solid var(--primary); padding:15px; }
  .plan .price { font-family:var(--serif); font-size:22px; color:var(--ink); }
  .plan .price small { font-family:var(--sans); font-size:12px; color:var(--neutral); font-weight:400; }
  .plan .grow { flex:1; }
  .plan .t { font-weight:700; color:var(--ink); }
  .plan .s { font-size:12px; color:var(--neutral); }

  .steps { display:flex; flex-direction:column; gap:0; }
  .step { display:grid; grid-template-columns:20px 1fr; gap:12px; padding-block:8px; position:relative; }
  .step .b { width:20px; height:20px; border-radius:50%; border:2px solid var(--line); background:var(--white); display:grid; place-items:center; font-size:10px; font-weight:700; color:var(--neutral); }
  .step.done .b { background:var(--success); border-color:var(--success); color:var(--white); }
  .step.now .b { background:var(--ink-deep); border-color:var(--ink-deep); color:var(--lime); }
  .step .t { font-weight:700; color:var(--steel); }
  .step.done .t, .step.now .t { color:var(--ink); }
  .step .s { font-size:12px; color:var(--neutral); }

  /* ---------- Scan ---------- */
  .cam { position:relative; background:radial-gradient(120% 80% at 50% 30%, #3A3350 0%, #1D1829 70%); border-radius:var(--r-lg); aspect-ratio:3/4; overflow:hidden; color:var(--white); display:flex; flex-direction:column; justify-content:flex-end; }
  .cam .grid { position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size:32px 32px; }
  .cam .car { position:absolute; left:50%; top:40%; transform:translate(-50%,-50%); width:190px; opacity:0.85; }
  .cam .plate { position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); background:#F5F5F0; color:#1A1A3A; font-weight:800; font-size:20px; letter-spacing:0.06em; padding:6px 14px; border-radius:4px; border:2px solid #C9C9C0; font-variant-numeric:tabular-nums; }
  .cam .box { position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); width:160px; height:56px; border:2px solid rgba(196,255,77,0.9); border-radius:6px; box-shadow:0 0 0 999px rgba(20,16,31,0.35); }
  .cam .box::before, .cam .box::after { content:""; position:absolute; width:14px; height:14px; border-color:var(--lime); border-style:solid; }
  .cam .box::before { left:-2px; top:-2px; border-width:3px 0 0 3px; }
  .cam .box::after { right:-2px; bottom:-2px; border-width:0 3px 3px 0; }
  .cam .scanline { position:absolute; left:8%; right:8%; top:20%; height:2px; background:linear-gradient(90deg, transparent, var(--lime), transparent); animation:scan 1.8s ease-in-out infinite; }
  .cam.found .scanline { display:none; }
  .cam.found { animation:shake 0.5s ease; }
  .cam .readout { position:relative; padding:14px; background:linear-gradient(180deg, transparent, rgba(20,16,31,0.9)); display:flex; flex-direction:column; gap:6px; }
  .cam .readout .r { font-size:12px; color:rgba(255,255,255,0.7); }
  .cam .readout .v { font-family:var(--serif); font-size:22px; }
  .cam .readout .v.match { color:var(--lime); }
  @keyframes scan { 0%{top:20%} 50%{top:80%} 100%{top:20%} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
  .targets { display:flex; gap:8px; flex-wrap:wrap; }
  .timer { font-family:var(--serif); font-size:44px; line-height:1; color:var(--ink); }

  .toast { position:absolute; left:16px; right:16px; top:56px; background:var(--white); border:1px solid var(--line); border-left:4px solid var(--primary); border-radius:12px; padding:12px 14px; box-shadow:0 12px 30px -12px rgba(32,19,46,0.4); display:flex; gap:10px; align-items:flex-start; z-index:5; }
  .toast .mk { width:28px; height:28px; border-radius:6px; flex:0 0 auto; }
  .toast .t { font-weight:700; color:var(--ink); font-size:13px; }
  .toast .s { font-size:12px; color:var(--steel); }
  .toast[hidden] { display:none; }

  .splash { flex:1; background:var(--ink-deep); color:var(--white); display:flex; flex-direction:column; justify-content:center; align-items:center; gap:18px; padding:32px; text-align:center; }
  .splash .mark { width:96px; height:96px; border-radius:24px; }
  .splash h1 { margin:0; font-size:32px; font-weight:800; letter-spacing:-0.02em; }
  .splash .sub { font-family:var(--serif); font-size:16px; color:rgba(255,255,255,0.75); }
  .splash .kicker { font-size:11px; letter-spacing:0.18em; color:var(--lime); font-weight:700; }

  @media (prefers-reduced-motion: reduce) { .cam .scanline, .cam.found { animation:none; } }
  @media (max-width: 860px) {
    .stage { grid-template-columns:1fr; padding-inline:16px; padding-block:16px; gap:16px; }
    .flow { display:none; }
    .device { height:740px; border-radius:36px; border-width:6px; }
    .topbar { padding-inline:16px; }
  }
</style>

<div class="shell">
  <header class="topbar">
    <div class="brand" id="brand"></div>
    <div class="meta">MVP1 클릭 프로토타입 · <b>D-015 Screen Map</b> 기준 · 2026-09-10 · 오른쪽에서 <b>고객 앱 / 크루 앱</b> 전환</div>
    <div class="seg" role="group" aria-label="앱 선택">
      <button type="button" id="seg-customer" data-app="customer" aria-pressed="true">고객 앱</button>
      <button type="button" id="seg-crew" data-app="crew" aria-pressed="false">크루 앱</button>
    </div>
  </header>

  <main class="stage">
    <aside class="flow">
      <h2 id="flow-title">고객 MVP 화면</h2>
      <ol id="flow-list"></ol>
      <div class="note" id="flow-note"></div>
    </aside>

    <div class="device-wrap">
      <div class="device">
        <div class="statusbar"><span>9:41</span><div class="notch"></div><span>●●● ⌁</span></div>
        <div class="toast" id="toast" hidden></div>
        <div class="screen" id="screen"></div>
        <nav class="tabbar" id="tabbar" aria-label="하단 탭"></nav>
      </div>
      <p class="hint">화면 안의 버튼을 눌러 흐름을 따라가세요. 데이터는 예시입니다.</p>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';

  // ---------- Brand mark (D-019 안 A · 열쇠+차) ----------
  function mark(size, cls) {
    return '<svg class="' + (cls || 'mark') + '" width="' + size + '" height="' + size + '" viewBox="0 0 140 140" role="img" aria-label="차집사 로고">'
      + '<rect width="140" height="140" rx="32" fill="#6B3FA0"/>'
      + '<circle cx="70" cy="42" r="14" fill="none" stroke="#fff" stroke-width="7"/>'
      + '<rect x="66" y="54" width="8" height="22" fill="#fff"/>'
      + '<rect x="66" y="66" width="16" height="7" fill="#fff"/>'
      + '<path d="M40 88 L50 74 H90 L100 88 H112 A6 6 0 0 1 118 94 V108 H22 V94 A6 6 0 0 1 28 88 Z" fill="#fff"/>'
      + '<circle cx="42" cy="110" r="9" fill="#fff"/><circle cx="98" cy="110" r="9" fill="#fff"/>'
      + '</svg>';
  }
  function carSvg() {
    return '<svg class="car" viewBox="0 0 190 90" aria-hidden="true"><path d="M20 62 L38 30 H140 L170 62 H182 V78 H8 V62 Z" fill="#9A93B0"/><path d="M48 34 H132 L150 58 H32 Z" fill="#C9C4DA"/><circle cx="44" cy="80" r="11" fill="#2A2438"/><circle cx="146" cy="80" r="11" fill="#2A2438"/></svg>';
  }
  var ICON = {
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg>',
    car: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16l1.5-5h11L19 16"/><rect x="3" y="16" width="18" height="4" rx="1"/><circle cx="7.5" cy="20" r="1.5"/><circle cx="16.5" cy="20" r="1.5"/></svg>',

    return '<div class="page">' + head('수입 · 정산')
      + '<div class="card dark"><div class="small">이번 주 지급 예정 (9/8 – 9/14)</div><div class="num" style="font-size:36px">' + won((22 + done) * CREW_PAY) + '<span class="small"> 원</span></div><div class="row" style="gap:20px"><div><div class="small">완료</div><div class="num" style="font-size:20px">' + (22 + done) + '대</div></div><div><div class="small">기본 단가</div><div class="num" style="font-size:20px">' + won(CREW_PAY) + '</div></div><div><div class="small">Batch 보너스</div><div class="num" style="font-size:20px">검증 중</div></div></div></div>'
      + '<div class="card"><div class="row between"><div class="h2">품질 지표</div><span class="small">지급과 분리 · 데이터로만</span></div><div class="row" style="gap:20px"><div><div class="small">QA 점수</div><div class="num" style="font-size:22px">4.9</div></div><div><div class="small">재세차율</div><div class="num" style="font-size:22px">1.2%</div></div><div><div class="small">시간당</div><div class="num" style="font-size:22px">2.4대</div></div></div></div>'
      + '<div class="card tight"><div class="list">'
      + '<div class="item"><div class="grow"><div class="t">9월 10일 (오늘)</div><div class="s">' + done + '대 완료 · 진행 중</div></div><span class="num">' + won(done * CREW_PAY) + '</span></div>'
      + '<div class="item"><div class="grow"><div class="t">9월 9일</div><div class="s">7대 · 지산동 · 범어동</div></div><span class="num">35,000</span></div>'
      + '<div class="item"><div class="grow"><div class="t">9월 8일</div><div class="s">8대 · 지산동</div></div><span class="num">40,000</span></div>'
      + '</div></div>'
      + '<p class="small" style="margin:0">단가는 5,000원부터 검증하며 500원 단위로 조정합니다. (D-007)</p>'
      + '</div>';
  };

  // ---------- Actions ----------
  var toastTimer = null;
  function toast(t, s) {
    var el = document.getElementById('toast');
    el.innerHTML = mark(28, 'mk') + '<div><div class="t">' + t + '</div><div class="s">' + s + '</div></div>';
    el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 3200);
  }
  function stopScan() { var sc = S.crew.scan; if (sc.timer) clearInterval(sc.timer); sc.timer = null; sc.running = false; }
  function startScan() {
    var sc = S.crew.scan; stopScan(); sc.found = false; sc.running = true; var n = 0;
    var target = S.crew.wos[S.crew.currentWo].plate;
    sc.timer = setInterval(function () {
      n++;
      if (n >= 4) { stopScan(); sc.found = true; sc.reading = target; render(); return; }
      sc.reading = DECOYS[(n + Math.floor(Math.random() * 2)) % DECOYS.length];
      var pl = document.querySelector('.cam .plate'), rd = document.querySelector('.cam .readout .v');
      if (pl) pl.textContent = sc.reading; if (rd) rd.textContent = sc.reading;
    }, 900);
  }
  function stopTick() { if (S.crew.work.tick) clearInterval(S.crew.work.tick); S.crew.work.tick = null; }

  var ACT = {
    cls: function (v) { S.customer.vehicleClass = v; },
    togglecls: function () { S.customer.vehicleClass = S.customer.vehicleClass === 'suv' ? 'sedan' : 'suv'; },
    plan: function (v) { S.customer.plan = v; },
    subscribe: function () { S.customer.subscribed = true; go('c-home', true); toast('결제 완료', planOf(S.customer).t + ' 구독이 시작됐어요. 첫 세차 일정을 잡았습니다.'); return true; },
    'oil-book': function () { toast('예약 요청 접수', '엔진오일 교체 가능한 시간을 곧 안내드릴게요.'); },
    'oil-done': function () { S.customer.oil.last = '2026-09-10'; toast('기록됐어요', '엔진오일 · 오늘 · 고객 입력. 다음 권장일을 다시 계산했습니다.'); },
    rewash: function () { S.customer.rewash = true; },
    batch: function (v) { S.crew.currentBatch = v; go('k-batch'); return true; },
    wo: function (v) { S.crew.currentWo = v; go('k-wo'); return true; },
    'scan-for': function (v) { S.crew.currentWo = v; S.crew.scan.found = false; S.crew.scan.reading = '— — ————'; go('k-scan'); startScan(); return true; },
    'scan-start': function () { startScan(); },
    'scan-stop': function () { stopScan(); },
    'scan-reset': function () { stopScan(); S.crew.scan.found = false; S.crew.scan.reading = '— — ————'; },
    'scan-manual': function () {
      var v = (document.getElementById('f-manual') || {}).value || ''; v = v.replace(/\s+/g, ' ').trim(); S.crew.scan.manual = v;
      var hit = null; Object.keys(S.crew.wos).forEach(function (id) { if (S.crew.wos[id].plate === v && S.crew.wos[id].state !== 'done') hit = id; });
      if (hit) { S.crew.currentWo = hit; S.crew.scan.found = true; S.crew.scan.reading = v; }
      else toast('확인 필요', '"' + (v || '빈 값') + '"은 오늘 작업 목록에 없어요. 유사 번호는 확인 후 진행하세요.');
    },
    'start-work': function (v) {
      S.crew.currentWo = v; var w = S.crew.wos[v]; w.state = 'working';
      S.crew.work = { started: Date.now(), before: false, after: false, finding: '', tick: null };
      S.crew.scan.found = false; S.crew.scan.reading = '— — ————'; stopScan();
      go('k-work'); toast('고객 Push 발송', '"세차가 시작되었습니다" · ' + w.plate); return true;
    },
    shot: function (v) { S.crew.work[v] = true; },
    finding: function (v) { S.crew.work.finding = v; },
    finish: function () { S.crew.wos[S.crew.currentWo].state = 'done'; stopTick(); go('k-done', true); return true; },
    issue: function (v) { S.crew.wos[S.crew.currentWo].state = 'issue'; stopTick(); go('k-batch', true); toast('이슈 기록됨', v + ' · 운영팀 Exception Queue로 전달 · 고객 회차 보전'); return true; },
    'next-wo': function () {
      var next = null; Object.keys(S.crew.wos).forEach(function (id) { if (!next && S.crew.wos[id].state === 'todo') next = id; });
      if (!next) { go('k-today', true); toast('오늘 작업 끝', '수고하셨어요. 정산은 수입 탭에서 확인하세요.'); return true; }
      S.crew.currentWo = next; S.crew.scan.found = false; S.crew.scan.reading = '— — ————'; go('k-scan', true); startScan(); return true;
    }
  };

  // ---------- Navigation & render ----------
  function go(id, reset) { if (reset) S.stack = []; else if (S.screen !== id) S.stack.push(S.screen); S.screen = id; }
  function back() { S.screen = S.stack.pop() || (S.app === 'customer' ? 'c-home' : 'k-today'); }
  function switchApp(app) { stopScan(); stopTick(); S.app = app; S.stack = []; S.screen = app === 'customer' ? 'c-splash' : 'k-login'; render(); }

  function render() {
    var scr = document.getElementById('screen');
    scr.innerHTML = R[S.screen] ? R[S.screen]() : '<div class="page">준비 중</div>';
    scr.scrollTop = 0;
    // tabbar
    var tb = document.getElementById('tabbar');
    if (NO_TAB[S.screen]) { tb.hidden = true; } else {
      tb.hidden = false;
      tb.innerHTML = TABS[S.app].map(function (t) { return '<button type="button" data-tab="' + t[0] + '" aria-current="' + (S.screen === t[0]) + '">' + ICON[t[2]] + t[1] + '</button>'; }).join('');
    }
    // flow list
    document.getElementById('flow-title').textContent = S.app === 'customer' ? '고객 MVP 화면' : '크루 MVP 화면';
    document.getElementById('flow-list').innerHTML = FLOWS[S.app].map(function (f, i) { return '<li><button type="button" data-jump="' + f[0] + '" aria-current="' + (S.screen === f[0]) + '"><span class="n">' + (i + 1) + '</span><span>' + f[1] + '</span></button></li>'; }).join('');
    document.getElementById('flow-note').innerHTML = NOTES[S.app];
    document.getElementById('seg-customer').setAttribute('aria-pressed', S.app === 'customer');
    document.getElementById('seg-crew').setAttribute('aria-pressed', S.app === 'crew');
    // timer tick
    stopTick();
    if (S.screen === 'k-work' && S.crew.work.started) { S.crew.work.tick = setInterval(function () { var t = document.getElementById('timer'); if (t) t.textContent = elapsed(); }, 1000); }
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) { try { window.claude.hot.snapshot({ app: S.app, screen: S.screen }); } catch (e) {} }
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-go],[data-back],[data-act],[data-tab],[data-jump],[data-app]');
    if (!el) return;
    if (el.dataset.app) { switchApp(el.dataset.app); return; }
    if (el.dataset.jump) { stopScan(); go(el.dataset.jump, true); render(); return; }
    if (el.dataset.tab) { stopScan(); go(el.dataset.tab, true); render(); return; }
    if (el.hasAttribute('data-back')) { stopScan(); back(); render(); return; }
    if (el.dataset.go) { go(el.dataset.go); render(); return; }
    if (el.dataset.act && ACT[el.dataset.act]) { var handled = ACT[el.dataset.act](el.dataset.v); if (!handled) render(); else render(); }
  });

  document.getElementById('brand').innerHTML = mark(32) + '<strong>차집사</strong><span>Vehicle Care Concierge</span>';

  function start(data) {
    if (data && data.app && R[data.screen]) { S.app = data.app; S.screen = data.screen; }
    // Deep link: #crew opens the crew app, #k-scan (or any screen id) opens that screen directly.
    var h = (location.hash || '').replace('#', '');
    if (h === 'crew') { S.app = 'crew'; S.screen = 'k-today'; }
    else if (h === 'customer') { S.app = 'customer'; S.screen = 'c-home'; }
    else if (R[h]) { S.app = h.charAt(0) === 'k' ? 'crew' : 'customer'; S.screen = h; }
    render();
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) { window.claude.hot.ready(start); } else { start((window.claude && window.claude.hot && window.claude.hot.data) || {}); }
})();
</script>

</body></html>
